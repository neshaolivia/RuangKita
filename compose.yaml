services:
    app:
        build:
            context: .
            target: final
        image: ruangkita-app:local
        env_file:
            - .env
        networks:
            - backend
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped

    web:
        image: nginx:alpine
        ports:
            - "8888:80"
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - ./public:/var/www/html/public:ro
        networks:
            - backend
        depends_on:
            - app
        restart: unless-stopped

    db:
        image: mysql:8.0
        environment:
            MYSQL_DATABASE: ruangkita
            MYSQL_USER: ruangkita
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: rootsecret
        volumes:
            - db_data:/var/lib/mysql
        networks:
            - backend
        healthcheck:
            test:
                [
                    "CMD",
                    "mysqladmin",
                    "ping",
                    "-h",
                    "localhost",
                    "-u",
                    "root",
                    "-prootsecret",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        restart: unless-stopped

volumes:
    db_data:

networks:
    backend:
        internal: true
